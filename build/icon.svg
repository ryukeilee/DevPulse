<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="DevPulse app icon">
  <defs>
    <linearGradient id="bg" x1="208" y1="122" x2="828" y2="910" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b414d"/>
      <stop offset="0.48" stop-color="#141a22"/>
      <stop offset="1" stop-color="#05080d"/>
    </linearGradient>
    <linearGradient id="glass" x1="170" y1="114" x2="840" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="166" y1="512" x2="862" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#39d6ff"/>
      <stop offset="0.52" stop-color="#27f1f4"/>
      <stop offset="1" stop-color="#89ffd5"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
