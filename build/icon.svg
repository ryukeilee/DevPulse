        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="rim" x="-4%" y="-4%" width="108%" height="108%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="none"/>
