    <path d="M126 318C226 132 487 98 896 116V566C694 338 342 306 126 746Z" fill="url(#glass)" opacity="0.72"/>
    <rect x="92" y="76" width="840" height="840" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="5" filter="url(#rim)"/>
    <rect x="112" y="96" width="800" height="800" rx="166" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  </g>

