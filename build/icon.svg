    <path d="M738 516V430C738 398 764 372 796 372" fill="none" stroke="url(#pulse)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M738 516V612C738 644 764 670 796 670" fill="none" stroke="url(#pulse)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="796" cy="372" r="42" fill="#122126" stroke="url(#pulse)" stroke-width="34"/>
    <circle cx="852" cy="516" r="42" fill="#122126" stroke="url(#pulse)" stroke-width="34"/>
