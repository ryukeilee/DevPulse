<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevPulse</title>
    <link rel="stylesheet" href="./widget.css">
  </head>
  <body>
    <main class="widget" id="widget" aria-live="polite">
      <header class="widget__header drag-region">
        <div class="brand">DevPulse</div>
      </header>

      <div class="window-controls no-drag" aria-label="窗口操作">
        <button class="widget-close-button" id="widget-close-button" type="button" title="关闭应用" aria-label="关闭应用">×</button>
        <button class="icon-button collapse-control" id="collapse-button" type="button" title="折叠">-</button>
        <button class="icon-button pin-control" id="pin-button" type="button" title="关闭置顶">Pin</button>
        <button class="icon-button expand-control" id="mini-expand-button" type="button" title="展开详细信息">+</button>
      </div>

      <section class="summary-row">
        <div>
          <div class="value value--project" id="project-name">暂无活跃项目</div>
          <div class="meta" id="project-meta">等待本地 Git 变化</div>
        </div>
      </section>

      <section class="block">
        <div class="label">Git 状态摘要</div>
        <div class="value" id="change-summary">等待本地 Git 变化</div>
      </section>

      <section class="stats">
        <div>
          <div class="label">Changed</div>
          <div class="stat-value" id="changed-count">0 files</div>
        </div>
        <div>
          <div class="label">Last update</div>
          <div class="stat-value" id="last-update">--:--</div>
        </div>
      </section>

      <section class="block">
        <div class="label">最近改动</div>
        <ul class="file-list" id="recent-files">
          <li>暂无</li>
        </ul>
      </section>

      <section class="mini-view" id="mini-view" hidden>
        <div class="mini-copy drag-region">
          <div class="mini-title" id="mini-title">DevPulse · watching</div>
          <div class="mini-meta" id="mini-meta">main · --:--</div>
        </div>
      </section>
    </main>

    <script src="./widget.js"></script>
  </body>
</html>
