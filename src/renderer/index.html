<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevPulse</title>
    <link rel="stylesheet" href="./widget.css">
  </head>
  <body>
    <main class="widget" id="widget" aria-live="polite">
      <header class="widget__header drag-region">
        <div class="brand">DevPulse</div>
        <div class="refresh-badge" id="refresh-status-badge">Watching</div>
      </header>

      <div class="window-controls no-drag" aria-label="窗口操作">
        <button class="action-button icon-button settings-control" id="settings-button" type="button" title="打开设置" aria-label="打开设置">Settings</button>
      </div>

      <div class="widget__body">
        <div class="widget__scroll">
          <section class="project-header panel">
            <div class="project-header__copy">
              <div class="label">Project</div>
              <h1 class="project-name" id="project-name">暂无活跃项目</h1>
              <div class="project-meta" id="project-meta">waiting · local Git only</div>
            </div>
            <div class="overall-status overall-status--good" id="overall-status">Good</div>
          </section>

          <section class="pulse-summary panel">
            <div class="metric">
              <div class="label">Activity</div>
              <div class="metric-value" id="activity-count">0</div>
            </div>
            <div class="metric">
              <div class="label">Risk</div>
              <div class="metric-value" id="risk-count">0</div>
            </div>
            <div class="metric metric--wide">
              <div class="label">Commit</div>
              <div class="metric-value metric-value--text" id="readiness-summary">暂无待提交改动</div>
            </div>
            <div class="next-action" id="next-action">等待本地 Git 变化</div>
          </section>

          <section class="content-grid">
            <div class="panel timeline-panel">
              <div class="section-heading">
                <div>
                  <div class="label">Recent Activity</div>
                  <div class="section-title" id="change-summary">最近活动</div>
                </div>
                <div class="section-meta" id="changed-count">最近 0 条</div>
              </div>
              <ul class="timeline-list" id="activity-list">
                <li class="empty-state">暂无最近活动</li>
              </ul>
            </div>

            <div class="panel risk-panel">
              <div class="section-heading">
                <div>
                  <div class="label">Risk Hints</div>
                  <div class="section-title">本地规则提示</div>
                </div>
              </div>
              <div class="risk-list" id="risk-hint-list">
                <div class="empty-state">暂无明显风险</div>
              </div>
            </div>

            <div class="panel readiness-panel">
              <div class="label">Commit Readiness</div>
              <div class="readiness-status commit-readiness--empty" id="commit-readiness-status">Ready</div>
              <div class="readiness-reason" id="commit-readiness-reason">暂无待提交改动</div>
              <div class="readiness-action" id="commit-readiness-action">保持观察</div>
            </div>
          </section>
        </div>

        <section class="action-row no-drag" aria-label="主操作">
          <button class="action-button pin-control" id="pin-button" type="button" title="关闭置顶">Pin</button>
          <button class="action-button mode-control" id="collapse-button" type="button" title="切换为迷你模式">Mini</button>
          <button class="action-button close-control" id="widget-close-button" type="button" title="关闭应用" aria-label="关闭应用">Close</button>
        </section>
      </div>

      <section class="settings-overlay no-drag" id="settings-overlay" aria-hidden="true">
        <div class="settings-backdrop" id="settings-backdrop"></div>
        <div class="settings-dialog panel" role="dialog" aria-modal="true" aria-labelledby="settings-title">
          <div class="settings-header">
            <div>
              <div class="label">Settings</div>
              <div class="section-title" id="settings-title">本地运行偏好</div>
            </div>
            <div class="settings-header-actions">
              <div class="section-meta" id="last-update">--:--</div>
              <button class="action-button settings-close-button" id="settings-close-button" type="button" title="关闭设置" aria-label="关闭设置">Done</button>
            </div>
          </div>
          <form class="settings-grid" id="settings-form">
            <label class="setting-field">
              <span>刷新间隔</span>
              <select id="refresh-interval">
                <option value="15000">15s</option>
                <option value="30000">30s</option>
                <option value="60000">1m</option>
                <option value="300000">5m</option>
              </select>
            </label>
            <label class="setting-field setting-field--checkbox">
              <input id="mini-mode-setting" type="checkbox">
              <span>Mini Mode</span>
            </label>
            <label class="setting-field setting-field--checkbox">
              <input id="notifications-setting" type="checkbox">
              <span>通知</span>
            </label>
            <label class="setting-field setting-field--checkbox">
              <input id="open-at-login-setting" type="checkbox">
              <span>开机启动</span>
            </label>
            <label class="setting-field">
              <span>保留天数</span>
              <input id="retention-days" type="number" min="1" max="90" step="1">
            </label>
          </form>
        </div>
      </section>

      <section class="mini-view" id="mini-view">
        <div class="mini-copy drag-region">
          <div class="mini-topline">
            <div class="mini-title" id="mini-title">DevPulse</div>
            <div class="mini-status overall-status--good" id="mini-status">Good</div>
          </div>
          <div class="mini-meta" id="mini-meta">main · 0 risks · Ready</div>
          <ul class="mini-activity-list" id="mini-activity-list">
            <li>暂无最近活动</li>
          </ul>
          <div class="mini-next-action" id="mini-next-action">等待本地 Git 变化</div>
          <div class="action-row mini-action-row no-drag">
            <button class="action-button expand-control" id="mini-expand-button" type="button" title="切换为完整模式">Full</button>
            <button class="action-button close-control" id="mini-close-button" type="button" title="关闭应用" aria-label="关闭应用">Close</button>
          </div>
        </div>
      </section>
    </main>

    <script src="./widget.js"></script>
  </body>
</html>
